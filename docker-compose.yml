# A3: one-command local deployment (localhost only, no public exposure)
# Usage: cp .env.example .env  ->  docker compose up --build
services:
  jt-postgres:
    image: postgres:17
    container_name: jt-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jt}
      POSTGRES_DB: ${DB_NAME:-job_tracker}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jt} -d ${DB_NAME:-job_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 20

  jt-app:
    build: ./backend
    container_name: jt-app
    depends_on:
      jt-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://jt-postgres:5432/${DB_NAME:-job_tracker}
      DB_USERNAME: ${DB_USERNAME:-jt}
      DB_PASSWORD: ${DB_PASSWORD:-jt}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800000}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3101}
      FLYWAY_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8081"

  jt-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: jt-frontend
    depends_on:
      - jt-app
    ports:
      - "127.0.0.1:3101:3000"

volumes:
  jt-pgdata:
